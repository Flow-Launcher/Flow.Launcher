# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - master
  pull_request:

jobs:
  build:

    runs-on: windows-latest
    env:
      FlowVersion: 1.20.2
      NUGET_CERT_REVOCATION_MODE: offline
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Set Flow.Launcher.csproj version
        id: update
        uses: vers-one/dotnet-project-version-updater@v1.8
        with:
          file: |
            "**/SolutionAssemblyInfo.cs"
          version: ${{ env.FlowVersion }}.${{ env.BUILD_NUMBER }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
#          cache: true
#          cache-dependency-path: |
#            Flow.Launcher/packages.lock.json
#            Flow.Launcher.Core/packages.lock.json            
#            Flow.Launcher.Infrastructure/packages.lock.json
#            Flow.Launcher.Plugin/packages.lock.json
      - name: Install vpk
        run: dotnet tool install -g vpk
      - name: Restore dependencies
        run: nuget restore Flow.Launcher.sln
      - name: Build
        run: dotnet build Flow.Launcher.sln --no-restore -c Release
      - name: Initialize Service
        run: |
          sc config WSearch start= auto # Starts Windows Search service- Needed for running ExplorerTest
          net start WSearch
      - name: Test
        run: dotnet test Flow.Launcher.sln --no-build --verbosity normal -c Release
      - name: Perform post_build tasks
        shell: powershell
        run: .\Scripts\post_build.ps1
      - name: Upload Avalonia Setup
        uses: actions/upload-artifact@v7
        with:
          name: Avalonia Setup
          path: |
            Output\Packages\Avalonia\Flow-Launcher-Avalonia-Setup.exe
          compression-level: 0
      - name: Upload Avalonia Portable Version
        uses: actions/upload-artifact@v7
        with:
          name: Avalonia Portable Version
          path: |
            Output\Packages\Avalonia\Flow-Launcher-Avalonia-Portable.zip
          compression-level: 0
      - name: Upload Plugin Nupkg
        uses: actions/upload-artifact@v7
        with:
          name: Plugin nupkg
          path: |
            Output\Release\Flow.Launcher.Plugin.*.nupkg
          compression-level: 0
      - name: Upload Setup
        uses: actions/upload-artifact@v7
        with:
          name: Flow Installer
          path: |
            Output\Packages\Flow-Launcher-*.exe
          compression-level: 0
      - name: Upload Portable Version
        uses: actions/upload-artifact@v7
        with:
          name: Portable Version
          path: |
            Output\Packages\Flow-Launcher-Portable.zip
          compression-level: 0
      - name: Upload Full Nupkg
        uses: actions/upload-artifact@v7
        with:
          name: Full nupkg
          path: |
            Output\Packages\FlowLauncher-*-full.nupkg
          compression-level: 0
      - name: Upload Release Information
        uses: actions/upload-artifact@v7
        with:
          name: RELEASES
          path: |
            Output\Packages\RELEASES
          compression-level: 0

  build-macos:

    runs-on: macos-latest
    env:
      FlowVersion: 1.20.2
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Set Flow.Launcher.csproj version
        uses: vers-one/dotnet-project-version-updater@v1.8
        with:
          file: |
            "**/SolutionAssemblyInfo.cs"
          version: ${{ env.FlowVersion }}.${{ env.BUILD_NUMBER }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and package Flow Launcher.app (osx-arm64, osx-x64)
        run: Scripts/macos/build-app.sh --zip osx-arm64 osx-x64
      - name: Upload macOS App (osx-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: macOS App (osx-arm64)
          path: |
            Output/macOS/Flow-Launcher-macOS-osx-arm64.zip
          compression-level: 0
      - name: Upload macOS App (osx-x64)
        uses: actions/upload-artifact@v7
        with:
          name: macOS App (osx-x64)
          path: |
            Output/macOS/Flow-Launcher-macOS-osx-x64.zip
          compression-level: 0

  build-linux:

    runs-on: ubuntu-latest
    env:
      FlowVersion: 1.20.2
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Set Flow.Launcher.csproj version
        uses: vers-one/dotnet-project-version-updater@v1.8
        with:
          file: |
            "**/SolutionAssemblyInfo.cs"
          version: ${{ env.FlowVersion }}.${{ env.BUILD_NUMBER }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Flow Launcher for Linux (linux-x64, linux-arm64)
        run: Scripts/linux/build.sh linux-x64 linux-arm64
      - name: Upload Linux tarball (linux-x64)
        uses: actions/upload-artifact@v7
        with:
          name: Linux App (linux-x64)
          path: |
            Output/Linux/flow-launcher-linux-x64.tar.gz
          compression-level: 0
      - name: Upload Linux tarball (linux-arm64)
        uses: actions/upload-artifact@v7
        with:
          name: Linux App (linux-arm64)
          path: |
            Output/Linux/flow-launcher-linux-arm64.tar.gz
          compression-level: 0
